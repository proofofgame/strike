name: Contract CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          curl -fsSL https://api.github.com/repos/stx-labs/clarinet/releases/latest \
            | jq -r '.assets[] | select(.name == "clarinet-linux-x64-glibc.tar.gz") | .browser_download_url' \
            | xargs -I{} curl -fsSL "{}" -o clarinet.tar.gz
          tar -xzf clarinet.tar.gz
          sudo mv clarinet /usr/local/bin/
          clarinet --version

      - name: Check contracts
        run: clarinet check

      - name: Run Vitest suite
        run: npm test